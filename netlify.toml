[build]
  command = "npm run build"
  publish = "dist"

# Static SPA — no Netlify Functions / Nitro server bundle.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Helps Whisper / ONNX WASM use SharedArrayBuffer when the runtime supports it.
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "credentialless"
