# Generated / selected by deploy/container/deploy.sh — do not edit host nginx.
name: dictation

services:
  app:
    build:
      context: ../..
      dockerfile: deploy/container/Dockerfile
    expose:
      - "8080"
    env_file:
      - .env.production
    networks:
      - internal
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/gateway.active.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/ssl:ro
      - certbot_www:/var/www/certbot:ro
    networks:
      - internal
      - public
    restart: unless-stopped

  certbot:
    profiles: ["certbot"]
    image: certbot/certbot:latest
    volumes:
      - certbot_www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
      - ./certs:/out
    networks:
      - public

networks:
  internal:
  public:

volumes:
  certbot_www:
  letsencrypt:
